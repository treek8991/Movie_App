# Gitleaks secret scanning. Phase ECHO item E01, dated 2026-08-03.
# Lifted from 01_Projects/15b_DD214Day_Web/.github/workflows/secret-scan.yml,
# which carried a "lift this into the shared template" note from D-60 that
# nobody acted on until now.
#
# Scans full history on every push and pull request, on every branch, because
# several repos in this portfolio live on long feature branches and a scan that
# only watches main watches nothing there. Fails the run on any finding.
#
# Rules come from the .gitleaks.toml stamped beside this file at the repo root:
# the gitleaks defaults plus the credential shapes this portfolio actually uses
# (Anthropic, Supabase service role, Resend, Stripe live).
#
# Source of truth: _tools/echo_stamp_2026-08-03/secret-scan.yml. Edit there.

name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout, full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
